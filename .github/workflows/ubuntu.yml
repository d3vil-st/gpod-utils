name: Build Debian Package

on:
  push:
    tags: [ "v*" ]

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential clang clang-tools autotools-dev autoconf libtool \
            libgpod-dev \
            libglib2.0-dev \
            git pkg-config nasm libmp3lame-dev zlib1g-dev \
            libjson-c-dev dh-make

      # built once on master by ffmpeg.yml; only rebuilt here on a cache miss
      - name: Restore ffmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/gpod-ffmpeg
            ~/gpod-ffmpeg-shared
          key: ffmpeg-${{ matrix.os }}-${{ hashFiles('ci/build-ffmpeg.sh') }}

      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          ci/build-ffmpeg.sh "$HOME/gpod-ffmpeg"
          ci/build-ffmpeg.sh "$HOME/gpod-ffmpeg-shared" shared

      - name: Build debs (gpod-utils + gpod-utils-shared)
        run: |
          FFMPEG_PREFIX="$HOME/gpod-ffmpeg" FFMPEG_SHARED_PREFIX="$HOME/gpod-ffmpeg-shared" \
            fakeroot debian/rules binary

      - name: Get debs
        run: |
          DISTRO=$(echo "${{ matrix.os }}" | sed 's/ubuntu-/ubuntu/')
          for f in ../gpod-utils_*.deb ../gpod-utils-shared_*.deb; do
            base=$(basename "$f" .deb)
            arch="${base##*_}"
            prefix="${base%_*}"
            cp "$f" "${prefix}~${DISTRO}_${arch}.deb"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.os }}
          path: gpod-utils*_*.deb
