name: Build Fedora RPM

on:
  push:
    tags: [ "v*" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    container: fedora:latest

    steps:
      - name: Install git
        run: dnf install -y git tar zstd

      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc make \
            autoconf automake libtool \
            pkgconfig \
            libgpod-devel \
            glib2-devel \
            lame-devel zlib-devel nasm \
            json-c-devel \
            sqlite-devel \
            rpm-build rpmdevtools

      # built once on master by ffmpeg.yml; only rebuilt here on a cache miss
      - name: Cache key
        id: key
        run: |
          . /etc/os-release
          echo "key=ffmpeg-fedora${VERSION_ID}-$(uname -m)-${{ hashFiles('ci/build-ffmpeg.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore ffmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/gpod-ffmpeg
            /opt/gpod-ffmpeg-shared
          key: ${{ steps.key.outputs.key }}

      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          ci/build-ffmpeg.sh /opt/gpod-ffmpeg
          ci/build-ffmpeg.sh /opt/gpod-ffmpeg-shared shared

      - name: Set version
        run: echo "VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_ENV

      - name: Create source tarball
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git archive --format=tar.gz --prefix=gpod-utils-${VERSION}/ \
            -o gpod-utils-${VERSION}.tar.gz HEAD

      - name: Build RPM
        run: |
          rpmdev-setuptree
          cp gpod-utils-${VERSION}.tar.gz ~/rpmbuild/SOURCES/
          rpmbuild -ba rpm/gpod-utils.spec --define "_version ${VERSION}" --define "ffmpeg_prefix /opt/gpod-ffmpeg"
          rpmbuild -bb rpm/gpod-utils.spec --define "_version ${VERSION}" --define "ffmpeg_shared_prefix /opt/gpod-ffmpeg-shared"

      - name: Collect RPMs
        run: find ~/rpmbuild/RPMS -name "gpod-utils-*.rpm" ! -name "*debug*" -exec cp {} . \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.os }}
          path: gpod-utils-*.rpm
